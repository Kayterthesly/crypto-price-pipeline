# =============================================================================
# .github/workflows/ci.yml
# Pipeline : crypto-price-pipeline
# Stage    : 6 → 8 — CI: lint → seed → data tests → unit tests → Docker → refresh
# Triggers : push/PR to main  |  daily cron 02:00 UTC
# Fix log  : v3 — shell: Rscript {0} for all R steps (eliminates -e quoting
#            issues on Linux bash), lintr installed inline (not in renv.lock
#            because renv snapshots only project-imported packages).
# =============================================================================

name: crypto-price-pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 02:00 UTC — after Asian crypto markets close
    - cron: '0 2 * * *'

# ── Job 1: Lint + Seed + Test ─────────────────────────────────────────────────
jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV_MODE: synthetic
      DB_PATH: data/crypto_prices.duckdb
      LOG_LEVEL: WARN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R 4.5.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore renv packages
        shell: Rscript {0}
        run: |
          install.packages("renv")
          renv::restore(prompt = FALSE)

      # lintr is a dev-only tool — renv::snapshot() excludes it because no
      # project .R file has library(lintr). Install it directly here.
      - name: Lint R scripts
        shell: Rscript {0}
        run: |
          if (!requireNamespace("lintr", quietly = TRUE)) {
            install.packages("lintr", repos = "https://cloud.r-project.org")
          }
          opts <- lintr::linters_with_defaults(
            line_length_linter = lintr::line_length_linter(120)
          )
          lintr::lint_dir("r_scripts", linters = opts)
          lintr::lint_dir("api",       linters = opts)
        continue-on-error: true   # lint warnings must never block deployment

      # shell: Rscript {0} writes the run: block to a temp .R file and executes
      # it as a proper R script — zero shell quoting / multiline issues.
      # The working directory is the repo root (set by actions/checkout).
      # .Rprofile → renv/activate.R activates the project library automatically.
      - name: Seed synthetic data
        shell: Rscript {0}
        run: |
          Sys.setenv(
            ENV_MODE  = "synthetic",
            DB_PATH   = "data/crypto_prices.duckdb",
            LOG_LEVEL = "WARN"
          )
          source("r_scripts/00_workspace_init.R")
          source("r_scripts/00_utils.R")
          source("r_scripts/01_ingestion.R")
          source("r_scripts/02_features.R")
          source("r_scripts/03_modeling.R")
          fetch_and_store_history("BTC-USD", years_back = 3)
          fetch_and_store_history("ETH-USD", years_back = 3)
          generate_pipeline_features("BTC-USD")
          generate_pipeline_features("ETH-USD")
          cat("Synthetic seed complete\n")

      - name: Run data tests
        run: Rscript tests/data_tests.R
        # Inherits job-level env: ENV_MODE=synthetic, DB_PATH, LOG_LEVEL

      # shell: Rscript {0} for the same reason as the seed step.
      # stop_on_failure=TRUE (testthat >= 3.0) exits with code 1 on any FAIL.
      - name: Run unit tests
        shell: Rscript {0}
        run: |
          Sys.setenv(
            ENV_MODE  = "synthetic",
            DB_PATH   = "data/crypto_prices.duckdb",
            LOG_LEVEL = "WARN"
          )
          library(testthat)
          library(withr)
          source("r_scripts/00_workspace_init.R")
          source("r_scripts/00_utils.R")
          source("r_scripts/01_ingestion.R")
          source("r_scripts/02_features.R")
          source("r_scripts/03_modeling.R")
          testthat::test_dir("tests/unit", stop_on_failure = TRUE)

# ── Job 2: Docker build + smoke test ─────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/Dockerfile -t crypto-price-pipeline:latest .

      - name: Smoke test container
        run: |
          docker run -d \
            -p 8000:8000 \
            -e ENV_MODE=synthetic \
            -e DB_PATH=data/crypto_prices.duckdb \
            -e LOG_LEVEL=WARN \
            --name cp-test \
            crypto-price-pipeline:latest
          echo "Waiting 90s for container startup and synthetic seed..."
          sleep 90
          curl -f http://localhost:8000/health \
            || (echo "=== Container logs ===" && docker logs cp-test && exit 1)
          docker stop cp-test

# ── Job 3: Daily refresh (cron trigger only) ──────────────────────────────────
  refresh:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R 4.5.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore renv packages
        shell: Rscript {0}
        run: |
          install.packages("renv")
          renv::restore(prompt = FALSE)

      # Seed synthetic base before attempting live Yahoo fetch.
      # 04_refresh.R reads feature_prices — the table must exist first.
      - name: Seed synthetic base data
        shell: Rscript {0}
        run: |
          Sys.setenv(
            ENV_MODE  = "synthetic",
            DB_PATH   = "data/crypto_prices.duckdb",
            LOG_LEVEL = "WARN"
          )
          source("r_scripts/00_workspace_init.R")
          source("r_scripts/00_utils.R")
          source("r_scripts/01_ingestion.R")
          source("r_scripts/02_features.R")
          fetch_and_store_history("BTC-USD", years_back = 5)
          fetch_and_store_history("ETH-USD", years_back = 5)
          generate_pipeline_features("BTC-USD")
          generate_pipeline_features("ETH-USD")
          cat("Synthetic seed complete — ready for live refresh\n")

      # continue-on-error: true — Yahoo Finance may be rate-limited or
      # unreachable from GitHub Actions runners. A transient Yahoo failure
      # must NOT turn the CI badge red. Railway handles the authoritative
      # daily update independently via its own container environment.
      - name: Run daily refresh (live Yahoo Finance)
        run: Rscript r_scripts/04_refresh.R
        env:
          ENV_MODE: live_yahoo
          DB_PATH: data/crypto_prices.duckdb
          LOG_LEVEL: INFO
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        continue-on-error: true