# =============================================================================
# .github/workflows/ci.yml
# Pipeline: crypto-price-pipeline
# Stage: 6 — CI: lint → test → data validate → build Docker
# Triggers: push and PR to main
# =============================================================================

name: crypto-price-pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R 4.5.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore packages
        run: R -e "install.packages('renv'); renv::restore(prompt=FALSE)"

      - name: Lint R scripts
        run: |
          R -e "lintr::lint_dir('r_scripts',
            linters = lintr::linters_with_defaults(
              line_length_linter = lintr::line_length_linter(120)
            ))"
        continue-on-error: true

      - name: Set up test data
        run: |
          Rscript -e "
            source('r_scripts/00_utils.R')
            source('r_scripts/01_ingestion.R')
            source('r_scripts/02_features.R')
            fetch_and_store_history('BTC-USD',    years_back=3)
            fetch_and_store_history('ETH-USD',    years_back=3)
            generate_pipeline_features('BTC-USD')
            generate_pipeline_features('ETH-USD')
          "
        env:
          ENV_MODE: synthetic
          DB_PATH: data/crypto_prices.duckdb
          LOG_LEVEL: WARN

      - name: Run data tests
        run: Rscript tests/data_tests.R
        env:
          ENV_MODE: synthetic
          DB_PATH: data/crypto_prices.duckdb
          LOG_LEVEL: WARN

      - name: Run unit tests
        run: |
          R -e "
            library(testthat)
            results <- testthat::test_dir('tests/unit', reporter='summary')
            df <- as.data.frame(results)
            if (sum(df[['failed']]) > 0) quit(status=1)
          "
        env:
          ENV_MODE: synthetic
          DB_PATH: data/crypto_prices.duckdb
          LOG_LEVEL: WARN

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/Dockerfile -t crypto-price-pipeline:latest .

      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name cp-test crypto-price-pipeline:latest
          sleep 90
          curl -f http://localhost:8000/health
          docker stop cp-test