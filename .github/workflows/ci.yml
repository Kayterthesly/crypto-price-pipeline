# =============================================================================
# .github/workflows/ci.yml
# Pipeline : crypto-price-pipeline
# Stage    : 6 → 8 — CI: lint → seed → data tests → unit tests → Docker → refresh
# Triggers : push/PR to main  |  daily cron 02:00 UTC
# =============================================================================

name: crypto-price-pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 02:00 UTC — after Asian crypto markets close
    - cron: '0 2 * * *'

# ── Job 1: Lint + Seed + Test ─────────────────────────────────────────────────
jobs:
  test:
    runs-on: ubuntu-latest

    # FIX 1: Job-level env so every step inherits these values.
    # Prevents each step having to redeclare ENV_MODE / DB_PATH.
    env:
      ENV_MODE: synthetic
      DB_PATH: data/crypto_prices.duckdb
      LOG_LEVEL: WARN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R 4.5.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true   # uses Posit Package Manager — pre-compiled binaries

      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore packages
        run: R -e "install.packages('renv'); renv::restore(prompt = FALSE)"

      # FIX 2: Lint both r_scripts/ AND api/ — plumber.R was never checked before.
      - name: Lint R scripts
        run: |
          R -e "
            opts <- lintr::linters_with_defaults(
              line_length_linter = lintr::line_length_linter(120)
            )
            lintr::lint_dir('r_scripts', linters = opts)
            lintr::lint_dir('api',       linters = opts)
          "
        continue-on-error: true   # lint warnings should not block deployment

      # FIX 3: Seed synthetic data for data tests AND unit tests.
      # - Sources 00_workspace_init.R first (creates data/ directory).
      # - Sources 03_modeling.R so unit tests can call compute_asset_forecasts().
      # - Explicit Sys.setenv() inside the script guards against any
      #   environment inheritance edge cases on the GitHub runner.
      - name: Seed synthetic data
        run: |
          Rscript -e "
            Sys.setenv(
              ENV_MODE  = 'synthetic',
              DB_PATH   = 'data/crypto_prices.duckdb',
              LOG_LEVEL = 'WARN'
            )
            source('r_scripts/00_workspace_init.R')
            source('r_scripts/00_utils.R')
            source('r_scripts/01_ingestion.R')
            source('r_scripts/02_features.R')
            source('r_scripts/03_modeling.R')
            fetch_and_store_history('BTC-USD', years_back = 3)
            fetch_and_store_history('ETH-USD', years_back = 3)
            generate_pipeline_features('BTC-USD')
            generate_pipeline_features('ETH-USD')
            cat('Synthetic seed complete\n')
          "

      - name: Run data tests
        run: Rscript tests/data_tests.R
        # Inherits job-level ENV_MODE=synthetic, DB_PATH, LOG_LEVEL

      # FIX 4: Unit tests need the full source chain loaded in the same session.
      # FIX 5: stop_on_failure=TRUE (testthat >= 3.0) — robust, no fragile data.frame parsing.
      - name: Run unit tests
        run: |
          R -e "
            Sys.setenv(
              ENV_MODE  = 'synthetic',
              DB_PATH   = 'data/crypto_prices.duckdb',
              LOG_LEVEL = 'WARN'
            )
            library(testthat)
            library(withr)
            source('r_scripts/00_workspace_init.R')
            source('r_scripts/00_utils.R')
            source('r_scripts/01_ingestion.R')
            source('r_scripts/02_features.R')
            source('r_scripts/03_modeling.R')
            testthat::test_dir('tests/unit', stop_on_failure = TRUE)
          "

# ── Job 2: Docker build + smoke test ─────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test                           # only runs if all test steps pass
    if: github.ref == 'refs/heads/main'  # skip on PRs — only build on merged commits

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/Dockerfile -t crypto-price-pipeline:latest .

      # FIX 6: Pass env vars so the container knows ENV_MODE on startup.
      # FIX 7: Dump container logs on curl failure — makes debugging possible.
      - name: Smoke test container
        run: |
          docker run -d \
            -p 8000:8000 \
            -e ENV_MODE=synthetic \
            -e DB_PATH=data/crypto_prices.duckdb \
            -e LOG_LEVEL=WARN \
            --name cp-test \
            crypto-price-pipeline:latest

          echo "Waiting 90s for container startup and synthetic DB seeding..."
          sleep 90

          curl -f http://localhost:8000/health \
            || (echo "=== Container logs ===" && docker logs cp-test && exit 1)

          docker stop cp-test

# ── Job 3: Daily refresh (cron trigger only) ──────────────────────────────────
  refresh:
    runs-on: ubuntu-latest
    needs: test                                        # only refresh if tests pass
    if: github.event_name == 'schedule'               # runs on cron only, not push/PR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R 4.5.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      # FIX 8: restore-keys added (was missing vs the test job — cache miss on first run).
      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore packages
        run: R -e "install.packages('renv'); renv::restore(prompt = FALSE)"

      # FIX 9: Seed synthetic base before attempting live Yahoo fetch.
      # 04_refresh.R reads from feature_prices — it must exist before the
      # script runs, even if the live fetch then overwrites with fresh data.
      - name: Seed synthetic base data
        run: |
          Rscript -e "
            Sys.setenv(
              ENV_MODE  = 'synthetic',
              DB_PATH   = 'data/crypto_prices.duckdb',
              LOG_LEVEL = 'WARN'
            )
            source('r_scripts/00_workspace_init.R')
            source('r_scripts/00_utils.R')
            source('r_scripts/01_ingestion.R')
            source('r_scripts/02_features.R')
            fetch_and_store_history('BTC-USD', years_back = 5)
            fetch_and_store_history('ETH-USD', years_back = 5)
            generate_pipeline_features('BTC-USD')
            generate_pipeline_features('ETH-USD')
            cat('Synthetic seed complete — ready for live refresh\n')
          "

      # FIX 10: continue-on-error: true — Yahoo Finance may be unreachable
      # from GitHub Actions runners (network policy or rate limiting).
      # A transient Yahoo failure should NOT turn the CI badge red.
      # The Railway container handles the authoritative daily update independently.
      - name: Run daily refresh (live Yahoo Finance)
        run: Rscript r_scripts/04_refresh.R
        env:
          ENV_MODE: live_yahoo
          DB_PATH: data/crypto_prices.duckdb
          LOG_LEVEL: INFO
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        continue-on-error: true   # Yahoo unreachable on CI runner is non-fatal