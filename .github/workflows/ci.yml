# =============================================================================
# .github/workflows/ci.yml
# Pipeline : crypto-price-pipeline
# Stage    : 6 to 8 CI: lint - seed+test - Docker - refresh
# Triggers : push/PR to main | daily cron 02:00 UTC
#
# v5 architecture: seed + data tests + unit tests run in ONE R session.
# Rationale: separate steps lose R session state. Functions sourced in step A
# are not in scope in step B. One session = functions defined once, DB seeded
# once, both test suites share the same environment. No inter-step uncertainty.
# data_tests.R is called via system() to isolate its quit() from this session.
# =============================================================================

name: crypto-price-pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:

# -- Job 1: Lint + Seed + Test ------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R 4.5.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore renv packages
        shell: Rscript {0}
        run: |
          install.packages("renv")
          renv::restore(prompt = FALSE)

      - name: Lint R scripts
        shell: Rscript {0}
        continue-on-error: true
        run: |
          if (!requireNamespace("lintr", quietly = TRUE))
            install.packages("lintr", repos = "https://cloud.r-project.org")
          opts <- lintr::linters_with_defaults(
            line_length_linter = lintr::line_length_linter(120)
          )
          lintr::lint_dir("r_scripts", linters = opts)
          lintr::lint_dir("api",       linters = opts)

      - name: Seed, data tests, and unit tests
        shell: Rscript {0}
        run: |
          Sys.setenv(
            ENV_MODE  = "synthetic",
            DB_PATH   = "data/crypto_prices.duckdb",
            LOG_LEVEL = "WARN"
          )

          cat("\n=== Loading pipeline functions ===\n")
          source("r_scripts/00_workspace_init.R")
          source("r_scripts/00_utils.R")
          source("r_scripts/01_ingestion.R")
          source("r_scripts/02_features.R")
          source("r_scripts/03_modeling.R")

          cat("\n=== Seeding raw_prices ===\n")
          fetch_and_store_history("BTC-USD", years_back = 3)
          fetch_and_store_history("ETH-USD", years_back = 3)

          cat("\n=== Seeding feature_prices ===\n")
          generate_pipeline_features("BTC-USD")
          generate_pipeline_features("ETH-USD")

          cat("\n=== Seeding model_registry ===\n")
          compute_asset_forecasts("BTC-USD", forecast_horizon = 30)
          gc(); Sys.sleep(0.2)
          compute_asset_forecasts("ETH-USD", forecast_horizon = 30)
          gc(); Sys.sleep(0.2)
          cat("\n=== All tables seeded ===\n")

          cat("\n=== Running data integrity tests ===\n")
          data_test_rc <- system("Rscript tests/data_tests.R")
          if (data_test_rc != 0) {
            stop("Data integrity tests FAILED (exit code ", data_test_rc, ")")
          }
          cat("\n=== Data integrity tests PASSED (14/14) ===\n")

          cat("\n=== Running unit tests ===\n")
          library(testthat)
          library(withr)
          testthat::test_dir("tests/unit", stop_on_failure = TRUE)
          cat("\n=== Unit tests PASSED ===\n")

# -- Job 2: Docker build + smoke test -----------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/Dockerfile -t crypto-price-pipeline:latest .

      - name: Smoke test container
        run: |
          docker run -d \
            -p 8000:8000 \
            -e ENV_MODE=synthetic \
            -e DB_PATH=data/crypto_prices.duckdb \
            -e LOG_LEVEL=WARN \
            --name cp-test \
            crypto-price-pipeline:latest
          echo "Waiting 90s for container startup and seeding..."
          sleep 90
          curl -f http://localhost:8000/health \
            || (echo "=== Container logs ===" && docker logs cp-test && exit 1)
          docker stop cp-test

# -- Job 3: Daily refresh (cron only) -----------------------------------------
  refresh:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R 4.5.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore renv packages
        shell: Rscript {0}
        run: |
          install.packages("renv")
          renv::restore(prompt = FALSE)

      - name: Seed synthetic base
        shell: Rscript {0}
        run: |
          Sys.setenv(
            ENV_MODE  = "synthetic",
            DB_PATH   = "data/crypto_prices.duckdb",
            LOG_LEVEL = "WARN"
          )
          source("r_scripts/00_workspace_init.R")
          source("r_scripts/00_utils.R")
          source("r_scripts/01_ingestion.R")
          source("r_scripts/02_features.R")
          fetch_and_store_history("BTC-USD", years_back = 5)
          fetch_and_store_history("ETH-USD", years_back = 5)
          generate_pipeline_features("BTC-USD")
          generate_pipeline_features("ETH-USD")
          cat("Synthetic seed complete\n")

      - name: Run live refresh
        run: Rscript r_scripts/04_refresh.R
        env:
          ENV_MODE: live_yahoo
          DB_PATH: data/crypto_prices.duckdb
          LOG_LEVEL: INFO
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        continue-on-error: true